name: CI workflow

on:
    push:
      branches: ['main']
    pull_request:
      branches: ['main']  

jobs: 
  lint: 
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: install dependency
        run: npm ci

      - name: run linter
        run: npm run lint

  test: 
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: install dependency
        run: npm ci


      - name: run test
        run: npm run test --if-present

  build: 
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: "npm"

      - name: install dependency
        run: npm ci

      - name: run build
        run: npm run build
      
